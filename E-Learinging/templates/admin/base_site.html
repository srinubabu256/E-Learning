{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Premium Django Admin Overlay */
    header#header { background: #0f172a !important; color: white !important; padding: 25px 40px !important; }
    #branding h1 { color: #6366f1 !important; font-weight: 800 !important; font-size: 1.5rem !important; }
    div.breadcrumbs { background: #1e293b !important; color: #cbd5e1 !important; border-bottom: 1px solid #334155 !important; padding: 12px 40px !important; }
    #content-main { padding: 40px !important; background: #0f172a !important; }
    body.dashboard { background: #0f172a !important; color: #f8fafc !important; }
    .module h2, .module caption, .inline-group h2 { background: #1e293b !important; color: white !important; font-weight: 700 !important; border-radius: 8px 8px 0 0 !important; }
    .module th, .module td { background: #0f172a !important; border-bottom: 1px solid #1e293b !important; color: #cbd5e1 !important; }
    div.module { border: 1px solid #1e293b !important; border-radius: 12px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important; background: #0f172a !important; }
    .addlink, .changelink { color: #6366f1 !important; font-weight: 700 !important; }
    .button, input[type=submit] { background: linear-gradient(135deg, #6366f1, #ec4899) !important; border: none !important; border-radius: 8px !important; font-weight: 700 !important; }
</style>
{% endblock %}

{% block userlinks %}
<a href="/dashboard/" style="background: #6366f1; color: white; padding: 6px 16px; border-radius: 5px; font-weight: 800; text-decoration: none; margin-right: 15px; border: 1px solid rgba(255,255,255,0.2);">Go to System Dashboard</a>
{{ block.super }}
{% endblock %}
