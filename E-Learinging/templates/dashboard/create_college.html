{% extends 'base.html' %}
{% load static %}

{% block title %}Create College | E-Learn{% endblock %}

{% block content %}
<div class="animate-fade" style="max-width: 800px; margin: 0 auto; padding-top: 40px;">
    <div class="glass p-5 rounded-4 shadow-lg border-0">
        <div style="margin-bottom: 40px; text-align: center;">
            <div style="width: 60px; height: 60px; background: rgba(99, 102, 241, 0.1); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i data-lucide="building" style="color: var(--primary-color); width: 32px;"></i>
            </div>
            <h1 class="fw-800">Register New College</h1>
            <p class="text-secondary small">Onboard a new educational institution into the system infrastructure.</p>
        </div>

        <form method="post" class="dynamic-form">
            {% csrf_token %}
            <div class="form-group mb-4">
                <label class="fw-bold small text-secondary uppercase mb-2 block">College Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter Full College Name" required>
            </div>
            <div class="form-group mb-5">
                <label class="fw-bold small text-secondary uppercase mb-2 block">Location</label>
                <input type="text" name="location" class="form-control" placeholder="e.g. Hyderabad, India">
            </div>
            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-primary w-100 justify-content-center py-3 fw-800">Complete Registration</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100 justify-content-center py-3 fw-800">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
