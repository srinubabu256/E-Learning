{% extends 'base.html' %}
{% load static %}

{% block title %}Quiz: {{ quiz.title }}{% endblock %}

{% block content %}
<div class="animate-fade">
    <div style="margin-bottom: 40px; display: flex; align-items: center; justify-content: space-between;">
        <div>
            <span class="badge badge-primary" style="margin-bottom: 12px; display: inline-block;">Knowledge Check</span>
            <h1 style="font-size: 2.5rem; letter-spacing: -1px;">{{ quiz.title }}</h1>
        </div>
        <div class="glass" style="padding: 12px 24px; border-radius: 12px; display: flex; align-items: center; gap: 12px;">
            <i data-lucide="timer" style="color: var(--secondary-color);"></i>
            <span id="timer" style="font-weight: 700; font-size: 1.2rem;">--:--</span>
        </div>
    </div>

    <form method="post" action="{% url 'submit_quiz' quiz.id %}">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 24px;">
            {% for q in questions %}
            <div class="glass" style="padding: 30px; border-radius: 24px;">
                <div style="display: flex; gap: 20px; margin-bottom: 24px;">
                    <span style="font-size: 1.5rem; font-weight: 800; color: var(--primary-color);">Q{{ forloop.counter }}.</span>
                    <h3 style="font-size: 1.25rem; line-height: 1.5;">{{ q.question }}</h3>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <label class="option-card" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s;">
                        <input type="radio" name="question_{{ q.id }}" value="{{ q.option1 }}" required style="width: auto;">
                        <span>{{ q.option1 }}</span>
                    </label>
                    <label class="option-card" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s;">
                        <input type="radio" name="question_{{ q.id }}" value="{{ q.option2 }}" style="width: auto;">
                        <span>{{ q.option2 }}</span>
                    </label>
                    <label class="option-card" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s;">
                        <input type="radio" name="question_{{ q.id }}" value="{{ q.option3 }}" style="width: auto;">
                        <span>{{ q.option3 }}</span>
                    </label>
                    <label class="option-card" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s;">
                        <input type="radio" name="question_{{ q.id }}" value="{{ q.option4 }}" style="width: auto;">
                        <span>{{ q.option4 }}</span>
                    </label>
                </div>
            </div>
            {% endfor %}
        </div>

        <div style="margin-top: 40px; text-align: right;">
            <button type="submit" class="btn btn-primary" style="padding: 16px 40px; font-size: 1.1rem; border-radius: 100px;">
                Finish and Submit <i data-lucide="check" style="width: 20px;"></i>
            </button>
        </div>
    </form>
</div>

<style>
    .option-card:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--primary-color);
    }
    input[type="radio"]:checked + span {
        font-weight: 700;
        color: var(--primary-color);
    }
</style>
{% endblock %}
